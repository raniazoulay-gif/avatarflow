<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TotanRomi Invoice AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&family=Rubik:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap">
<style>
:root{--bg:#F4F6FB;--surface:#FFFFFF;--surface2:#F8FAFC;--line:#E7EBF3;--ink:#0F172A;--muted:#64748B;--faint:#94A3B8;
  --c2:#7C3AED;--c2soft:#F3EEFF;--c1soft:#E6FAFD;--ok:#059669;--oksoft:#E7F8F1;--warn:#B45309;--warnsoft:#FEF3E2;--bad:#DC2626;--badsoft:#FDECEC;
  --grad:linear-gradient(90deg,#06B6D4,#7C3AED);--shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.06);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0B1020;--surface:#121A2E;--surface2:#0F172A;--line:#23304A;--ink:#E6EAF2;--muted:#9AA7BD;--faint:#6B7A93;--c2soft:#231A45;--c1soft:#0C2B33;--ok:#34D399;--oksoft:#0E2E25;--warn:#FBBF24;--warnsoft:#332611;--bad:#F87171;--badsoft:#3A1618;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Rubik','Segoe UI',Arial,sans-serif;font-size:15px}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--c2);outline-offset:2px}
a{color:var(--c2)}
.en{font-family:'Space Grotesk',system-ui,sans-serif;direction:ltr;unicode-bidi:isolate}
.num{font-variant-numeric:tabular-nums}
.gt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.wm{font-family:'Pacifico',cursive;direction:ltr;unicode-bidi:isolate}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:30px;font-size:13px;font-weight:600;white-space:nowrap}
.c-ok{background:var(--oksoft);color:var(--ok)}.c-warn{background:var(--warnsoft);color:var(--warn)}.c-bad{background:var(--badsoft);color:var(--bad)}.c-mut{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}.c-ai{background:var(--c2soft);color:var(--c2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:10px 18px;font-weight:700;background:var(--grad);color:#fff;box-shadow:0 6px 16px rgba(124,58,237,.25);text-decoration:none}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.danger{background:var(--badsoft);color:var(--bad);box-shadow:none}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
h1,h2,h3{margin:0;text-wrap:balance}
.brand{text-align:center}.brand .wm{font-size:40px;line-height:1.3}.brand .sub{font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:6px;font-size:13px}
/* auth */
.auth{min-height:100%;display:grid;place-items:center;padding:32px 16px;background:radial-gradient(700px 500px at 15% 10%,var(--c1soft),transparent 60%),radial-gradient(700px 600px at 90% 95%,var(--c2soft),transparent 60%),var(--bg)}
.auth .card{width:min(460px,100%);padding:32px}
.field{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.field label{font-size:13px;color:var(--muted)}
.field textarea,.pick input[type=email],.pick input:not([type]){border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:10px 14px;font:inherit;color:var(--ink)}
.field input,.field select{height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px;font:inherit;color:var(--ink);width:100%}
.err{color:var(--bad);font-weight:600;margin-top:12px;min-height:1em}
/* shell */
#app{display:grid;grid-template-columns:250px 1fr;min-height:100%}
.side{background:var(--surface);border-left:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.side .brand{margin-bottom:18px}.side .brand .wm{font-size:32px}
.nav{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;border:0;background:none;color:var(--muted);font-weight:500;text-align:right;width:100%}
.nav:hover{background:var(--surface2)}
.nav.on{background:linear-gradient(90deg,var(--c1soft),var(--c2soft));color:var(--c2);font-weight:700}
.nav .badge{margin-right:auto;background:var(--c2);color:#fff;border-radius:20px;font-size:12px;padding:1px 8px}
.sys{margin-top:auto;padding:14px;border-radius:14px;background:linear-gradient(135deg,var(--c1soft),var(--c2soft));font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--ok)}
.top{display:flex;align-items:center;gap:12px;padding:14px 26px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.top h2{font-size:22px}
.search{display:flex;align-items:center;gap:8px;height:40px;border-radius:11px;background:var(--surface2);border:1px solid var(--line);padding:0 12px;color:var(--faint);width:230px}
.search input{border:0;background:transparent;font:inherit;color:var(--ink);width:100%;outline:none}
main{padding:24px 26px 40px;display:flex;flex-direction:column;gap:20px;min-width:0}
.banner{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:14px;background:var(--warnsoft);color:var(--warn);font-weight:600;font-size:14px;flex-wrap:wrap}
.banner.info{background:var(--c2soft);color:var(--c2)}
.banner.bad{background:var(--badsoft);color:var(--bad)}
.hello{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}.hello h1{font-size:27px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.kpi{padding:18px 20px}.kpi.click{cursor:pointer;transition:transform .15s,box-shadow .15s}.kpi.click:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(124,58,237,.14)}.kpi.click .d::after{content:' ›';font-weight:700}.kpi .h{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:14px;gap:8px}
.kpi .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.kpi .v{font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:700;margin-top:6px}
.kpi .d{font-size:12.5px;margin-top:2px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:18px}
.pane{padding:20px 22px;min-width:0}.pane h3{font-size:17px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.pane h3 .chip{margin-right:auto}
.list .it{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.list .it:last-child{border-bottom:0}
.ft{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font:700 11px 'Space Grotesk',sans-serif;flex:none;background:var(--badsoft);color:var(--bad)}
.ft.DOCX,.ft.DOC{background:#E6EEFE;color:#2563EB}.ft.XLSX,.ft.XLS{background:var(--oksoft);color:var(--ok)}
.grow{flex:1;min-width:0}.t1{font-weight:700;overflow:hidden;text-overflow:ellipsis}.t2{font-size:13px;color:var(--muted)}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:640px}
th{font-size:13px;color:var(--muted);font-weight:600;text-align:right;padding:10px 12px;background:var(--surface2);border-bottom:1px solid var(--line)}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface2)}
.bar{height:8px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--grad);border-radius:8px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:30px;padding:7px 14px;font-weight:600;font-size:13.5px;color:var(--muted)}
.filters button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.doc{padding:12px;cursor:pointer}
.thumb{height:110px;border-radius:10px;background:var(--surface2);position:relative;padding:12px}
.thumb span{display:block;height:7px;border-radius:5px;background:var(--line);margin-bottom:9px}
.thumb b{position:absolute;left:8px;bottom:8px;background:var(--bad);color:#fff;font:700 11px 'Space Grotesk';padding:2px 7px;border-radius:5px}
.thumb em{position:absolute;right:8px;bottom:8px;width:26px;height:26px;border-radius:50%;background:var(--ok);display:grid;place-items:center;color:#fff}
.toggle{width:52px;height:30px;border-radius:30px;border:0;position:relative;background:var(--line);flex:none;padding:0}
.toggle[aria-checked="true"]{background:var(--grad)}
.toggle::after{content:"";position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:right .15s}
.toggle[aria-checked="true"]::after{right:26px}
.set{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.set:last-child{border-bottom:0}
input[type=range]{width:100%;accent-color:#7C3AED}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.row .field{flex:1;min-width:180px}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:20}
.preview{margin-top:16px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface2)}
.preview iframe{display:block;width:100%;height:min(70vh,760px);border:0;background:#fff}
.preview img{display:block;max-width:100%;margin:0 auto}
.preview .bar2{display:flex;gap:8px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.seen{color:var(--c2)}.unseen{color:var(--line)}tr.new td b{font-weight:800}tr.new td:first-child{box-shadow:inset -3px 0 0 var(--c2)}
.modal2 .scrim{z-index:30}.modal2 .modal{z-index:31}
.pick{display:flex;flex-direction:column;gap:8px;margin-top:12px}.pick label{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}.pick label:has(input:checked){border-color:var(--c2);background:var(--c2soft)}
.modal{position:fixed;inset:0;z-index:21;display:grid;place-items:center;padding:16px;pointer-events:none}
.modal>.card{pointer-events:auto;width:min(540px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:24px}
.modal .dates{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pbar{height:10px;border-radius:10px;background:var(--line);overflow:hidden;margin:14px 0 8px}.pbar i{display:block;height:100%;background:linear-gradient(90deg,#06B6D4,#7C3AED);transition:width .4s}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(760px,100%);background:var(--surface);z-index:21;box-shadow:0 0 60px rgba(0,0,0,.25);overflow:auto;padding:22px 22px calc(22px + env(safe-area-inset-bottom,0px))}
.step{display:flex;gap:12px;align-items:flex-start;position:relative;padding-bottom:16px}
.step .b{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--grad);color:#fff}
.step.pend .b{background:var(--surface2);color:var(--faint);border:1px solid var(--line)}
.step:not(:last-child)::before{content:"";position:absolute;right:16px;top:36px;bottom:0;width:2px;background:var(--line)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:12px;font-weight:600;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:92vw}
.copy{display:flex;gap:8px;align-items:center;background:var(--surface2);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:10px;word-break:break-all;font-size:13px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.tabbar{display:none}
.chart{width:100%;height:auto;direction:ltr}
ol.guide{padding-right:20px;margin:8px 0 0;display:grid;gap:6px;font-size:14px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.search{display:none}}
@media (max-width:760px){
  #app{grid-template-columns:1fr}.side{display:none}.top{padding:12px 16px}
  main{padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px))}
  .kpi .v{font-size:27px}.hello h1{font-size:22px}
  .list .it{flex-wrap:wrap}.list .it .grow{flex-basis:calc(100% - 56px)}
  .tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around}
  .tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);padding:6px 4px;min-width:54px}
  .tabbar button.on{color:var(--c2);font-weight:700}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="auth" class="auth" hidden></div>
<div id="app" hidden>
  <aside class="side" id="side"></aside>
  <div style="min-width:0"><div class="top" id="top"></div><main id="main"></main></div>
  <nav class="tabbar" id="tabbar"></nav>
</div>
<div id="layer"></div><div id="layer2"></div>
<script>
"use strict";
/* ---------------- utilities ---------------- */
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const IC={eye:'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',eyeoff:'<path d="M2 12s3.6-7 10-7c2 0 3.8.7 5.2 1.6M22 12s-3.6 7-10 7c-2 0-3.8-.7-5.2-1.6"/><path d="M3 3l18 18"/>',home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',mail:'<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 6.5l8.5 6.5 8.5-6.5"/>',file:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>',truck:'<path d="M3 6h11v10H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/>',chart:'<path d="M4 20V4M4 20h16"/><path d="M8 16v-4M12 16V8M16 16v-6"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.9.8 3.1 2.6 3.5 5.2"/>',cog:'<circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M2.5 12h3M18.5 12h3M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1"/>',scan:'<path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/>',send:'<path d="M21 3L10 14"/><path d="M21 3l-7 18-4-7-7-4z"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>',check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',shield:'<path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/>',tag:'<path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.5"/>',folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',logout:'<path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 16l-4-4 4-4M6 12h10"/>',building:'<path d="M4 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16M16 9h2a2 2 0 0 1 2 2v10"/><path d="M8 7h4M8 11h4M8 15h4M3 21h18"/>',alert:'<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17h.01"/>',down:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',plus:'<path d="M12 5v14M5 12h14"/>',link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>',drive:'<path d="M8 3h8l6 10-4 7H6l-4-7z"/><path d="M8 3l6 10H2M16 3L10 13M6 20l4-7h12"/>'};
const i=(n,s='')=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="${s}">${IC[n]||''}</svg>`;
const COLORS=['#0891B2','#7C3AED','#DB2777','#EA580C','#059669','#2563EB','#9333EA'];
const av=(name)=>{name=String(name||'?');let h=0;for(const c of name)h=(h*31+c.charCodeAt(0))>>>0;return `<span class="av" style="background:${COLORS[h%COLORS.length]}">${esc(name[0])}</span>`;};
const money=(v,c)=>v==null?'':((!c||['ILS','NIS'].includes(String(c).toUpperCase()))?'₪':esc(c)+' ')+Number(v).toLocaleString('en-US',{maximumFractionDigits:0});
const dt=s=>{if(!s)return'';const d=new Date(s);return d.toLocaleDateString('he-IL',{day:'numeric',month:'numeric'})};
const dtt=s=>{if(!s)return'';const d=new Date(s);return d.toLocaleString('he-IL',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'})};
const BUCKET={duplicate:['כפילות','c-ai'],no_attachments:['בלי קובץ','c-mut'],invoice:['חשבונית','c-ok'],review:['לבדיקה','c-warn'],not_invoice:['לא חשבונית','c-mut'],error:['שגיאה','c-bad'],pending:['בתהליך','c-mut']};
const bchip=b=>{const x=BUCKET[b]||BUCKET.pending;return `<span class="chip ${x[1]}">${x[0]}</span>`};
const score=d=>`<span class="chip c-ai">${i('spark','width:14px;height:14px')}<span class="en num">${Number(d.score)|0}%</span></span>`;
const ft=d=>`<span class="ft ${esc(d.file_type)}">${esc(d.file_type)}</span>`;
function toast(msg){const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),3200);}
async function api(path,opt={}){
  const o={credentials:'same-origin',headers:{'X-Requested-With':'fetch'},...opt};
  if(opt.json!==undefined){o.method=o.method||'POST';o.headers['Content-Type']='application/json';o.body=JSON.stringify(opt.json);}
  const r=await fetch(path,o);
  if(r.status===401&&!path.startsWith('/api/auth')){S.me=null;showLogin();throw new Error('login');}
  let data=null;try{data=await r.json()}catch(e){}
  if(!r.ok) throw new Error((data&&data.detail)||('שגיאה '+r.status));
  return data;
}
function loginBox(r,title){
  return `<p class="t2" style="margin-top:12px">${esc(title)}</p><div class="copy" style="white-space:pre-line;word-break:normal;align-items:flex-start"><span class="grow">${esc(r.message)}</span></div>
  <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><button type="button" class="btn sm ghost" data-copy="${esc(r.message)}">${i('copy','width:15px;height:15px')}העתקת ההודעה</button>
  <a class="btn sm ghost" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(r.message)}">שליחה בוואטסאפ</a></div>`;
}

/* ---------------- charts ---------------- */
function bars(vals,labels,hi){
  const W=520,H=180,max=Math.max(...vals,1),bw=W/Math.max(vals.length,1);
  return `<svg class="chart" viewBox="0 0 ${W} ${H+28}" role="img" aria-label="גרף"><defs><linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#06B6D4"/><stop offset="1" stop-color="#7C3AED"/></linearGradient></defs>
   ${[0,.5,1].map(f=>`<line x1="0" x2="${W}" y1="${H-f*H*.9}" y2="${H-f*H*.9}" stroke="var(--line)"/>`).join('')}
   ${vals.map((v,k)=>{const h=v/max*H*.9;return `<rect x="${k*bw+bw*.22}" y="${H-h}" width="${bw*.56}" height="${Math.max(h,1)}" rx="7" fill="${k===hi?'url(#gb)':'var(--line)'}"/><text x="${k*bw+bw/2}" y="${H-h-6}" text-anchor="middle" font-size="12" font-family="Space Grotesk" fill="var(--muted)">${v}</text><text x="${k*bw+bw/2}" y="${H+20}" text-anchor="middle" font-size="12.5" fill="var(--muted)">${esc(labels[k])}</text>`}).join('')}</svg>`;
}

/* ---------------- scan: the user picks which dates to scan ---------------- */
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const SCAN_PRESETS=[['1h','השעה האחרונה'],['today','היום'],['7d','7 ימים אחרונים'],['30d','30 יום אחרונים'],['this','החודש הנוכחי'],['prev','החודש הקודם'],['3m','3 חודשים'],['6m','6 חודשים'],['12m','שנה אחורה']];
function scanPreset(k){
  const now=new Date();let f=new Date(now),to=new Date(now);S.scanHours=k==='1h'?1:null;
  if(k==='1h'||k==='today'){}
  else if(k.endsWith('d'))f.setDate(now.getDate()-(parseInt(k)-1));
  else if(k==='this')f=new Date(now.getFullYear(),now.getMonth(),1);
  else if(k==='prev'){f=new Date(now.getFullYear(),now.getMonth()-1,1);to=new Date(now.getFullYear(),now.getMonth(),0);}
  else f=new Date(now.getFullYear(),now.getMonth()-parseInt(k),now.getDate()+1);
  $('sc_from').value=iso(f);$('sc_to').value=iso(to);
  document.querySelectorAll('[data-sp]').forEach(b=>b.classList.toggle('on',b.dataset.sp===k));scanSummary();
}
function scanSummary(){const a=$('sc_from').value,b=$('sc_to').value;if(S.scanHours){$('sc_sum').textContent='ייסרקו רק מיילים שהגיעו בשעה האחרונה.';return;}$('sc_sum').textContent=a&&b?`ייסרקו רק מיילים שהגיעו בין ${dt(a)} ל-${dt(b)}.`:'בחרו טווח תאריכים.';}
async function openScan(){
  let st={running:false};try{st=await api('/api/scan/status')}catch(x){}
  const today=iso(new Date());
  $('layer').innerHTML=`<div class="scrim" data-close="1"></div><div class="modal"><div class="card" role="dialog" aria-label="סריקת חשבוניות">
   <h3 style="margin:0 0 4px;font-size:20px;display:flex;align-items:center;gap:8px">${i('scan','color:var(--c2)')}סריקת חשבוניות מהמייל</h3>
   <p class="muted" style="margin:0 0 14px">אתם בוחרים מאיזו תקופה לשאוב חשבוניות. המערכת סורקת רק את התיבה שלכם ורק את התאריכים שבחרתם. מיילים מהעבר לא נשלחים לרואה החשבון; הם נשמרים ומסווגים.</p>
   <div id="sc_body">
   <div class="filters">${SCAN_PRESETS.map(([k,l])=>`<button type="button" data-sp="${k}">${l}</button>`).join('')}</div>
   <div class="dates" style="margin-top:14px"><div class="field"><label for="sc_from">מתאריך</label><input id="sc_from" type="date" max="${today}"></div>
   <div class="field"><label for="sc_to">עד תאריך</label><input id="sc_to" type="date" max="${today}" value="${today}"></div></div>
   <p class="t2" id="sc_sum" style="margin-top:10px">בחרו טווח תאריכים.</p>
   <div style="display:flex;gap:10px;margin-top:16px"><button class="btn" id="scan_go" style="flex:1;height:46px">${i('scan')}התחלת סריקה</button><button type="button" class="btn ghost" data-close="1" style="height:46px">ביטול</button></div>
   <div class="err" id="sc_er"></div></div></div></div>`;
  if(st.running)scanProgress();else{scanPreset('30d');}
  ['sc_from','sc_to'].forEach(id=>$(id)&&$(id).addEventListener('change',()=>{document.querySelectorAll('[data-sp]').forEach(b=>b.classList.remove('on'));S.scanHours=null;scanSummary();}));
}
async function startScan(){
  $('sc_er').textContent='';
  try{const r=await api('/api/scan',{json:S.scanHours?{hours:S.scanHours}:{from:$('sc_from').value,to:$('sc_to').value}});
    if(!r.started)toast('כבר רצה סריקה. מציגים את ההתקדמות שלה');scanProgress();}
  catch(x){$('sc_er').textContent=x.message}
}
async function scanProgress(){
  const box=$('sc_body');if(!box)return;
  let st;try{st=await api('/api/scan/status')}catch(x){return;}
  const pct=st.total?Math.round(st.done/st.total*100):(st.running?3:100);
  box.innerHTML=`<p class="t1" style="margin:4px 0 0">${st.running?'סורקים את המייל…':'הסריקה הסתיימה'}</p>
   <p class="t2">${dt(st.from)} – ${dt(st.to)}</p>
   <div class="pbar"><i style="width:${pct}%"></i></div>
   <p class="t2">${st.total?`טופלו <b class="num">${st.done}</b> מתוך <b class="num">${st.total}</b> מיילים חדשים`:(st.running?'מחפשים מיילים בטווח שבחרתם…':'לא נמצאו מיילים חדשים לטיפול בטווח הזה')}</p>
   <div class="grid2" style="margin-top:12px;gap:10px"><div class="card pane kpi click" data-kf="invoice" style="padding:14px"><div class="t2">חשבוניות שזוהו</div><div class="num" style="font-size:26px;font-weight:700">${st.invoices}</div></div>
   <div class="card pane kpi click" data-kf="review" style="padding:14px"><div class="t2">ממתינים לבדיקה שלכם</div><div class="num" style="font-size:26px;font-weight:700">${st.review}</div></div></div>
   ${st.running?'':`<div class="set" style="margin-top:10px"><span class="grow">מיילים בטווח התאריכים</span><b class="num">${st.found||0}</b></div>
   <div class="set"><span class="grow">כבר טופלו קודם</span><b class="num">${Math.max(0,(st.found||0)-(st.total||0))}</b></div>
   <div class="set"><span class="grow">עם קובץ, לא חשבונית</span><b class="num">${st.not_invoice||0}</b></div>
   <div class="set"><span class="grow">בלי קובץ מצורף (לא נבדקו)</span><b class="num">${st.no_attachments||0}</b></div>
   ${st.errors?`<div class="set"><span class="grow">שגיאות בקריאה</span><b class="num">${st.errors}</b></div>`:''}`}
   ${st.error?`<div class="banner bad" style="margin-top:12px">${i('alert')}<span class="grow">${/invalid_grant|invalid_scope|RefreshError/.test(st.error)?'החיבור ל-Gmail צריך רענון. לחצו על "חיבור Gmail" ואשרו שוב (מסמנים את כל ההרשאות).':esc(st.error)}</span>${/invalid_grant|invalid_scope|RefreshError/.test(st.error)?'<a class="btn sm" href="/oauth/google/start">חיבור Gmail</a>':''}</div>`:''}
   <div style="display:flex;gap:10px;margin-top:16px">${st.running?`<button type="button" class="btn ghost" data-close="1" style="flex:1;height:44px">סגירה (הסריקה תמשיך ברקע)</button>`:`<button type="button" class="btn" data-kf="" style="flex:1;height:44px">${i('file')}הצגת כל המסמכים</button><button type="button" class="btn ghost" data-close="1" data-refresh="1" style="height:44px">סגירה</button>`}</div>`;
  if(st.running)setTimeout(scanProgress,2000);
}

/* ---------------- send to whoever handles it (a person's explicit action) ---------------- */
async function openSend(id){
  let o;try{o=await api(`/api/emails/${id}/send-options`)}catch(x){toast(x.message);return;}
  S.sendId=id;
  const opts=o.options.map((x,k)=>`<label><input type="radio" name="snd_to" value="${k}" ${k===0?'checked':''}><span class="grow"><b>${esc(x.label)}</b><span class="t2 en" style="display:block">${esc(x.email)}</span></span></label>`).join('');
  S.sendOpts=o.options;
  $('layer2').innerHTML=`<div class="modal2"><div class="scrim" data-close2="1"></div><div class="modal"><div class="card" role="dialog" aria-label="העברה לגורם מטפל">
   <h3 style="margin:0 0 4px;font-size:20px;display:flex;align-items:center;gap:8px">${i('send','color:var(--c2)')}העברה לגורם מטפל</h3>
   ${o.from_email?`<p class="muted" style="margin:0">החשבונית תישלח עם הקובץ המקורי מהתיבה שלך: <b class="en">${esc(o.from_email)}</b></p>`:`<div class="banner bad" style="margin-top:10px">${i('alert')}כדי לשלוח צריך קודם לחבר את תיבת ה-Gmail שלכם.</div>`}
   <div class="pick">${opts}<label><input type="radio" name="snd_to" value="other" ${o.options.length?'':'checked'}><span class="grow"><b>כתובת אחרת</b><input id="snd_email" class="en" type="email" placeholder="name@company.co.il" style="margin-top:6px;width:100%"><input id="snd_label" placeholder="למי? (למשל: מחלקת כספים)" style="margin-top:6px;width:100%"></span></label></div>
   <div class="field"><label for="snd_note">הערה (לא חובה)</label><textarea id="snd_note" rows="3" maxlength="1500" style="width:100%;resize:vertical" placeholder="למשל: לתשלום עד סוף החודש"></textarea></div>
   <div style="display:flex;gap:10px;margin-top:16px"><button class="btn" id="snd_go" style="flex:1;height:46px" ${o.from_email?'':'disabled'}>${i('send')}שליחה</button><button type="button" class="btn ghost" data-close2="1" style="height:46px">ביטול</button></div>
   <div class="err" id="snd_er"></div></div></div></div>`;
  const em=$('snd_email');if(em)em.addEventListener('focus',()=>{const r=document.querySelector('input[name=snd_to][value=other]');if(r)r.checked=true;});
}
async function doSend(){
  const btn=$('snd_go');$('snd_er').textContent='';
  const sel=document.querySelector('input[name=snd_to]:checked');if(!sel){$('snd_er').textContent='בחרו למי לשלוח';return;}
  let to,label;
  if(sel.value==='other'){to=$('snd_email').value.trim();label=$('snd_label').value.trim();if(!to){$('snd_er').textContent='הקלידו כתובת מייל';return;}}
  else{const o=S.sendOpts[Number(sel.value)];to=o.email;label=o.label;}
  btn.disabled=true;btn.textContent='שולח…';
  try{await api(`/api/emails/${S.sendId}/send`,{json:{to,label,note:$('snd_note').value}});
    $('layer2').innerHTML='';toast('נשלח ל-'+to);openDoc(S.sendId);}
  catch(x){$('snd_er').textContent=x.message;btn.disabled=false;btn.innerHTML=i('send')+'שליחה';}
}

/* ---------------- detail drawer ---------------- */
function filePreview(d){
  const atts=d.attachments||[];if(!atts.length)return '';
  const a=atts.find(x=>x.best)||atts[0];
  const name=(a.filename||'').toLowerCase(), mt=(a.mime_type||'').toLowerCase();
  const pdf=mt==='application/pdf'||name.endsWith('.pdf'), img=/^image\/(png|jpe?g|gif|webp)$/.test(mt);
  const url='/api/files/'+Number(a.id);
  const others=atts.filter(x=>x!==a).map(x=>`<a class="btn sm ghost" href="/api/files/${Number(x.id)}" target="_blank" rel="noopener">${i('file','width:15px;height:15px')}${esc(x.filename)}</a>`).join('');
  return `<div class="preview">${pdf?`<iframe src="${url}" title="${esc(a.filename)}" loading="lazy"></iframe>`:img?`<img src="${url}" alt="${esc(a.filename)}">`:`<div style="padding:22px" class="muted">${i('file')} ${esc(a.filename)} - אי אפשר להציג את סוג הקובץ הזה כאן. אפשר להוריד אותו.</div>`}
   <div class="bar2"><b class="grow en" style="font-size:13px">${esc(a.filename)}</b><button type="button" class="btn sm" data-send="${Number(d.id)}">${i('send','width:15px;height:15px')}העבר לגורם מטפל</button><a class="btn sm ghost" href="${url}" target="_blank" rel="noopener">${i('file','width:15px;height:15px')}פתיחה במסך מלא</a><a class="btn sm ghost" href="${url}?download=1">${i('down','width:15px;height:15px')}הורדה</a>${others}</div></div>`;
}
async function openDoc(id){
  let d;try{d=await api('/api/emails/'+id)}catch(x){toast(x.message);return;}
  const b=d.bucket;
  document.querySelectorAll(`tr[data-open="${Number(id)}"]`).forEach(tr=>{tr.classList.remove('new');const c=tr.firstElementChild;if(c){c.innerHTML=i('eye','width:19px;height:19px;color:var(--c2)');c.title='נצפה';}});
  $('layer').innerHTML=`<div class="scrim" data-close="1"></div><aside class="drawer" role="dialog" aria-label="פרטי מסמך">
   <div style="display:flex;align-items:center;gap:10px"><h2 style="font-size:20px" class="grow">${esc(d.supplier)}</h2><button class="btn ghost sm" data-close="1" aria-label="סגירה">${i('x','width:16px;height:16px')}</button></div>
   <p class="muted" style="margin:4px 0 14px">${esc(d.subject)}<br><span class="en">${esc(d.sender)}</span>${d.owner?' · תיבה של '+esc(d.owner):''}</p>
   <div style="display:flex;gap:8px;flex-wrap:wrap">${bchip(b)}${score(d)}${d.total!=null?`<span class="chip c-mut num">${money(d.total,d.currency)}</span>`:''}${ft(d)}</div>
   ${b==='duplicate'?`<div class="banner" style="margin-top:16px">${i('copy')}<span class="grow">זו חשבונית, אבל אותו קובץ בדיוק כבר התקבל${d.duplicate_of?` ב-${dt(d.duplicate_of.received_at)}${d.duplicate_of.owner?' בתיבה של '+esc(d.duplicate_of.owner):''}`:''}. היא נשמרה, ולא תישלח לרואה החשבון פעם שנייה.</span>${d.duplicate_of&&d.duplicate_of.id?`<button class="btn sm ghost" data-open="${d.duplicate_of.id}">למייל המקורי</button>`:''}</div>`:''}
   ${filePreview(d)}
   ${(d.sends||[]).length?`<div class="card pane" style="margin-top:14px"><h3>${i('send','color:var(--c2)')}הועבר לטיפול</h3>${d.sends.map(x=>`<div class="set"><span class="grow">${x.label?esc(x.label)+' · ':''}<span class="en">${esc(x.to)}</span></span><span class="t2">${dtt(x.at)}${x.by?' · '+esc(x.by):''}</span></div>`).join('')}</div>`:''}
   ${d.reasons.length?`<div class="card pane" style="margin-top:16px"><h3>${i('spark','color:var(--c2)')}למה ה-AI החליט כך</h3><ul style="margin:0;padding-right:18px">${d.reasons.map(r=>`<li style="margin:5px 0">${esc(r)}</li>`).join('')}</ul></div>`:''}
   ${b==='review'?`<div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap"><button class="btn" data-rv="${d.id}" data-d="invoice">${i('check')}זו חשבונית</button><button class="btn ghost" data-rv="${d.id}" data-d="not_invoice">זו לא חשבונית</button></div>`
     :(b==='invoice'||b==='duplicate')&&!(d.forward&&d.forward.state==='SENT')?`<div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap"><button class="btn ghost" data-rv="${d.id}" data-d="not_invoice">${i('x')}זו לא חשבונית</button></div>`
     :b==='not_invoice'?`<div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap"><button class="btn ghost" data-rv="${d.id}" data-d="invoice">${i('check')}זו כן חשבונית</button></div>`:''}
   <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap"><a class="btn ghost" href="${esc(d.gmail_link)}" target="_blank" rel="noopener">${i('mail')}פתיחה ב-Gmail</a>${!d.reviewed&&!(d.forward&&d.forward.state==='SENT')?`<button type="button" class="btn ghost" data-recheck="${Number(d.id)}">${i('scan')}בדיקה חוזרת</button>`:''}${d.drive_file_id?`<a class="btn ghost" href="https://drive.google.com/file/d/${encodeURIComponent(d.drive_file_id)}/view" target="_blank" rel="noopener">${i('drive')}הקובץ ב-Drive</a>`:''}</div></aside>`;
}

/* ---------------- events ---------------- */
document.addEventListener('click',async e=>{
  const t=e.target;
  const rv=t.closest('[data-rv]');if(rv){rv.disabled=true;try{await api(`/api/emails/${rv.dataset.rv}/review`,{json:{decision:rv.dataset.d}});$('layer').innerHTML='';toast(rv.dataset.d==='invoice'?'סומן כחשבונית':'סומן כ"לא חשבונית"');render();}catch(x){toast(x.message);rv.disabled=false}return;}
  const o=t.closest('[data-open]');if(o){openDoc(o.dataset.open);return;}
  if(t.closest('[data-close]')){const rf=t.closest('[data-refresh]');$('layer').innerHTML='';if(rf)render();return;}
  const f=t.closest('[data-f]');if(f){S.filter=f.dataset.f;S.offset=0;render();return;}
  const pg=t.closest('[data-pg]');if(pg){S.offset=Math.max(0,S.offset+Number(pg.dataset.pg));render();return;}
  const mo=t.closest('[data-mo]');if(mo){S.month=mo.dataset.mo;render();return;}
  const cp=t.closest('[data-copy]');if(cp){copyText(cp.dataset.copy);return;}
  const tg=t.closest('[data-tg]');if(tg){const v=tg.getAttribute('aria-checked')!=='true';tg.setAttribute('aria-checked',v);try{await api('/api/settings',{method:'PUT',json:{[tg.dataset.tg]:v}});toast('נשמר')}catch(x){toast(x.message)}return;}
  if(t.closest('#scan')){openScan();return;}
  const sd=t.closest('[data-send]');if(sd){openSend(Number(sd.dataset.send));return;}
  if(t.closest('[data-close2]')){$('layer2').innerHTML='';return;}
  if(t.closest('#snd_go')){doSend();return;}
  const kf=t.closest('[data-kf]');if(kf){const v=kf.dataset.kf;$('layer').innerHTML='';
    if(v.startsWith('#')){go(v.slice(1));return;}
    if(v.startsWith('@')){adminList(v.slice(1));return;}
    S.filter=v;S.offset=0;go('inbox');return;}
  const rc=t.closest('[data-recheck]');if(rc){rc.disabled=true;rc.textContent='בודק שוב…';
    try{const r=await api(`/api/emails/${rc.dataset.recheck}/recheck`,{json:{}});toast('נבדק שוב: '+((BUCKET[r.bucket]||[''])[0]||'עודכן'));openDoc(rc.dataset.recheck);if(S.view==='inbox'||S.view==='dash')render();}
    catch(x){toast(x.message);rc.disabled=false;rc.textContent='בדיקה חוזרת';}return;}
  const sp=t.closest('[data-sp]');if(sp){scanPreset(sp.dataset.sp);return;}
  if(t.closest('#scan_go')){startScan();return;}
  if(t.closest('#xls')){window.location='/api/reports/excel';return;}
  const rp=t.closest('[data-rpw]');if(rp){if(rp.dataset.sure){try{const r=await api(`/api/team/${rp.dataset.rpw}/reset-password`,{json:{}});$('rpw_out').innerHTML=`<div class="card pane">${loginBox(r,'נוצרה סיסמה ראשונית חדשה. שלחו לעובד:')}</div>`;rp.textContent='איפוס סיסמה';delete rp.dataset.sure;}catch(x){toast(x.message)}}else{rp.dataset.sure=1;rp.textContent='לחצו שוב לאישור';}return;}
  const de=t.closest('[data-deact]');if(de){if(de.dataset.sure){try{await api(`/api/team/${de.dataset.deact}/active`,{json:{active:false}});toast('העובד הושבת');render()}catch(x){toast(x.message)}}else{de.dataset.sure=1;de.textContent='לחצו שוב לאישור';}return;}
  const ca=t.closest('[data-cancel]');if(ca){try{await api(`/api/team/invites/${ca.dataset.cancel}/cancel`,{json:{}});render()}catch(x){toast(x.message)}return;}
  const pr=t.closest('[data-prod]');if(pr){
    if(pr.dataset.on==='1'&&!pr.dataset.sure){pr.dataset.sure=1;pr.textContent='לחצו שוב: שליחה אמיתית לרו״ח';return;}
    try{await api(`/api/admin/orgs/${pr.dataset.prod}`,{json:{production_enabled:pr.dataset.on==='1',confirm:'PRODUCTION'}});toast('עודכן');render()}catch(x){toast(x.message)}return;}
  const ac=t.closest('[data-act]');if(ac){try{await api(`/api/admin/orgs/${ac.dataset.act}`,{json:{active:ac.dataset.on==='1'}});render()}catch(x){toast(x.message)}return;}
  if(t.closest('#myorg')){const name=(S.me.user.name||'')+' - העסק שלי';try{await api('/api/admin/my-org',{json:{name}});await loadMe();go('settings');toast('העסק נוצר. עדכן את השם והגדרות')}catch(x){toast(x.message)}return;}
});

    $('inv_out').innerHTML=loginBox(r,r.sent?'פרטי הכניסה נשלחו לעובד במייל. אפשר לשלוח גם בוואטסאפ:':'שלחו לעובד את פרטי הכניסה (וואטסאפ או מייל):');const box=$('inv_out').innerHTML;await render();if($('inv_out'))$('inv_out').innerHTML=box;}catch(x){toast(x.message)}}
  if(f.id==='st'){e.preventDefault();try{await api('/api/settings',{method:'PUT',json:{name:$('s_nm').value,accountant_email:$('s_acc').value,forward_threshold:Number($('s_thr').value),minutes_per_document:Number($('s_min').value)}});await loadMe();toast('ההגדרות נשמרו')}catch(x){toast(x.message)}}
  if(f.id==='gg'){e.preventDefault();const j={google_client_id:$('g_id').value};if($('g_sec').value)j.google_client_secret=$('g_sec').value;try{await api('/api/settings',{method:'PUT',json:j});await loadMe();toast('החיבור נשמר. עכשיו כל עובד יכול לחבר את התיבה שלו');render()}catch(x){toast(x.message)}}
  if(f.id==='sl'){e.preventDefault();try{const r=await api('/api/admin/signup-link',{json:{note:$('sl_note').value}});$('sl_out').innerHTML=`<div class="copy"><span class="en grow">${esc(r.link)}</span><button type="button" class="btn sm ghost" data-copy="${esc(r.link)}">${i('copy','width:15px;height:15px')}העתקה</button></div><p class="t2">בתוקף ל-14 יום, לשימוש חד-פעמי.</p>`}catch(x){toast(x.message)}}
});
document.addEventListener('input',e=>{if(e.target.id==='s_thr')$('thrv').textContent=e.target.value+'%';});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('layer2').innerHTML){$('layer2').innerHTML='';return;}$('layer').innerHTML='';}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[data-kf]')){e.preventDefault();e.target.click();}});

/* ---------------- render / boot ---------------- */
const VIEWS={dash:vDash,inbox:vInbox,docs:vDocs,sup:vSup,reports:vReports,team:vTeam,settings:vSettings,admin:vAdmin};
async function render(){
  const allowed=navItems().map(x=>x[0]);
  if(!allowed.includes(S.view)) S.view=allowed[0]||'admin';
  renderShell();
  const main=$('main');
  const top=banners();
  main.innerHTML=top+'<div class="empty">טוען…</div>';
  try{main.innerHTML=top+await VIEWS[S.view]();renderShell();}
  catch(x){if(x.message!=='login')main.innerHTML=top+`<div class="banner bad">${i('alert')}${esc(x.message)}</div>`;}
}
async function loadMe(){S.me=await api('/api/me');}
async function boot(){
  const path=location.pathname, tok=new URLSearchParams(location.search).get('t');
  if(tok&&['/setup','/signup','/join'].includes(path)){showTokenForm(path.slice(1),tok);return;}
  if(path==='/forgot'){showForgot();return;}
  try{await loadMe();}catch(x){if(x.message!=='login')authCard(`<p class="err">${esc(x.message)}</p>`);else if(path==='/signup')showSignup();else showLogin();return;}
  if(S.me.user.must_change_password){showChangePw(true);return;}
  $('auth').hidden=true;$('app').hidden=false;
  const h=location.hash.slice(1);S.view=TITLES[h]?h:(S.me.org?'dash':'admin');
  render();
}
boot();
</script>
